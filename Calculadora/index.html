<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../Calculadora/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora em Python</title>
</head>
<body>
    <div class="calculator-container">

        <div class="calculator-display">
            
        </div>

        <div class="calculator-buttons">
            <button class="clear">C</button>
            <button class="backspace"><img src="../Calculadora/Image/backspace.png" alt="icone backspace"></button>
            <button class="operator">%</button>
            <button class="operator">/</button>
            
            <button class="number">7</button>
            <button class="number">8</button>
            <button class="number">9</button>
            <button class="operator">*</button>
            
            <button class="number">4</button>
            <button class="number">5</button>
            <button class="number">6</button>
            <button class="operator">-</button>
            
            <button class="number">1</button>
            <button class="number">2</button>
            <button class="number">3</button>
            <button class="operator">+</button>
            
            <button class="zero">0</button>
            <button class="result">=</button>
        </div>
    </div>

    <script src="../Calculadora/script.js"></script>
</body>
</html>
